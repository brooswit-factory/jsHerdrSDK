name: herdr-parity-schedule
on:
  schedule:
    # Daily, independent of any PR — an upstream herdr release should show up
    # here first, not as a red required check on someone else's unrelated PR.
    - cron: "17 13 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  parity:
    name: scheduled parity with latest herdr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: install latest herdr
        run: |
          export HERDR_INSTALL_DIR="$RUNNER_TEMP/herdr-bin"
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "HERDR_BIN=$HERDR_INSTALL_DIR/herdr" >> "$GITHUB_ENV"
          "$HERDR_INSTALL_DIR/herdr" --version
      - name: SDK matches installed herdr; file/update/close a herdr-parity-drift issue
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bun run scripts/parity/scheduled.ts
